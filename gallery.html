<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Meta tags for search engines -->
    <meta
      name="description"
      content="Love Running. Club for runners in Dublin, Ireland. Urban running, trail running. Dublin docklands and Phoenix Park"
    />
    <meta
      name="keywords"
      content="love running, run, running club, runners, Ireland, Dublin, sport, exercise"
    />
    <title>Love Running</title>
    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <a href="index.html">
        <h1 id="logo">Love Running</h1>
      </a>
      <input type="checkbox" id="nav-toggle" name="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label"
        ><i class="fa-solid fa-bars"></i
      ></label>
      <nav>
        <ul id="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html" class="active">Gallery</a></li>
          <li><a href="signup.html">Sign Up</a></li>
        </ul>
      </nav>
    </header>
    <!-- Main content -->
    <main>
      <section id="gallery">
        <h2 class="hidden-heading">Gallery</h2>
        <div id="photos">
          <div class="gallery-item">
            <img src="assets/images/athletes.webp" alt="Two athletes running together" />
            <button onclick="addToCart('Athletes Photo')">Add to Cart</button>
          </div>
          <div class="gallery-item">
            <img src="assets/images/girls.webp" alt="Three girls at charity paint running festival" />
            <button onclick="addToCart('Girls Festival Photo')">Add to Cart</button>
          </div>
          <div class="gallery-item">
            <img src="assets/images/runner3.webp" alt="Solo male runner jogging on beach" />
            <button onclick="addToCart('Male Beach Runner Photo')">Add to Cart</button>
          </div>
          <div class="gallery-item">
            <img src="assets/images/man.webp" alt="Man at charity paint running festival" />
            <button onclick="addToCart('Man Festival Photo')">Add to Cart</button>
          </div>
          <div class="gallery-item">
            <img src="assets/images/runner1.webp" alt="Solo female runner jogging through Phoenix Park" />
            <button onclick="addToCart('Female Park Runner Photo')">Add to Cart</button>
          </div>
          <div class="gallery-item">
            <img src="assets/images/runner2.webp" alt="Runners competing in marathon" />
            <button onclick="addToCart('Marathon Runners Photo')">Add to Cart</button>
          </div>
          <div class="gallery-item">
            <img src="assets/images/runner4.webp" alt="Solo female runner jogging on beach" />
            <button onclick="addToCart('Female Beach Runner Photo')">Add to Cart</button>
          </div>
          <div class="gallery-item">
            <img src="assets/images/running_gang.webp" alt="Large group of runners taking part in a marathon on a rainy day" />
            <button onclick="addToCart('Running Gang Photo')">Add to Cart</button>
          </div>
          <div class="gallery-item">
            <img src="assets/images/mud-run.webp" alt="Two women runners taking a muddy selfie after the Mud Runners championship" />
            <button onclick="addToCart('Mud Run Selfie Photo')">Add to Cart</button>
          </div>
        </div>
      </section>
      <!-- Cart Section -->
      <section id="cart-section">
        <h3>Your Cart</h3>
        <ul id="cart-list"></ul>
        <button id="checkout-btn" onclick="checkout()">Checkout</button>
        <p id="cart-message"></p>
      </section>
    </main>
    <footer>
      <ul id="social-networks">
        <li>
          <a
            href="https://www.facebook.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (opens in a new tab)"
            ><i class="fa-brands fa-facebook"></i
          ></a>
        </li>
        <li>
          <a
            href="https://www.twitter.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Twitter page (opens in a new tab)"
            ><i class="fa-brands fa-x-twitter"></i
          ></a>
        </li>

        <li>
          <a
            href="https://www.youtube.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our You Tube page (opens in a new tab)"
            ><i class="fa-brands fa-youtube"></i
          ></a>
        </li>

        <li>
          <a
            href="https://www.instagram.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Instagram page (opens in a new tab)"
            ><i class="fa-brands fa-instagram"></i
          ></a>
        </li>
      </ul>
    </footer>
    <!-- Font Awesome kit -->
    <script src="https://kit.fontawesome.com/3b20d96fa9.js" crossorigin="anonymous"></script>
    <script>
      // Simple cart logic
      let cart = [];
      function addToCart(item) {
        cart.push(item);
        updateCart();
      }
      function updateCart() {
        const cartList = document.getElementById('cart-list');
        cartList.innerHTML = '';
        cart.forEach((item, idx) => {
          const li = document.createElement('li');
          li.textContent = item;
          // Remove button for each item
          const removeBtn = document.createElement('button');
          removeBtn.textContent = 'Remove';
          removeBtn.onclick = function() {
            cart.splice(idx, 1);
            updateCart();
          };
          li.appendChild(removeBtn);
          cartList.appendChild(li);
        });
      }
      function checkout() {
        if (cart.length === 0) {
          document.getElementById('cart-message').textContent = 'Your cart is empty.';
        } else {
          document.getElementById('cart-message').textContent = 'Thank you for your purchase!';
          cart = [];
          updateCart();
        }
      }
    </script>
  </body>
</html>
